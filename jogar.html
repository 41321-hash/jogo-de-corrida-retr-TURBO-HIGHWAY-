.touch-btn-brake{border-color:#ef4444;color:#ef4444}.touch-btn-brake:active{background:#ef4444;color:#fff}.modal-overlay{position:absolute;inset:0;background:#05070cf2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:100;border-radius:8px}.arcade-title{font-size:38px;color:var(--neon-yellow);letter-spacing:4px;text-shadow:0 0 20px var(--neon-yellow),0 0 35px var(--neon-magenta);margin-bottom:6px;animation:titlePulse 1.8s infinite alternate}@keyframes titlePulse{0%{transform:scale(1)}to{transform:scale(1.05)}}.arcade-subtitle{font-size:13px;color:var(--neon-cyan);letter-spacing:2px;margin-bottom:24px}.arcade-btn-primary{padding:14px 34px;background:#000;border:3px solid var(--neon-cyan);color:var(--neon-cyan);font-family:inherit;font-size:18px;font-weight:900;cursor:pointer;letter-spacing:2px;border-radius:6px;box-shadow:0 0 15px #66fcf166;transition:all .2s;margin-top:16px}.arcade-btn-primary:hover{background:var(--neon-cyan);color:#000;box-shadow:0 0 25px var(--neon-cyan);transform:scale(1.05)}.instructions-card{background:#111724;border:1px solid #2b394e;border-radius:8px;padding:12px 16px;font-size:12px;color:#ccc;line-height:1.6;max-width:380px;margin:12px 0;text-align:left}.game-over-stats{background:#101622;border:1px solid #33435c;border-radius:8px;padding:16px;width:100%;max-width:320px;margin:16px 0;display:flex;flex-direction:column;gap:8px}.stat-row{display:flex;justify-content:space-between;font-size:14px}.stat-row-value{color:var(--neon-cyan);font-weight:700}</style>
  </head>
